[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[patch.crates-io]
ale = { git = "https://github.com/BrageHK/ale-rs", rev = "fff8f32324e61d8c32d6a9ebd3c778e20901eec1" }
ale-sys = { git = "https://github.com/BrageHK/ale-rs", rev = "fff8f32324e61d8c32d6a9ebd3c778e20901eec1" }

[workspace.dependencies]
burn = { version = "~0.21", default-features = false }
burn-import = { version = "~0.21", features = ["onnx"] }
serde = { version = "1.0.228", features = ["derive"] }
rand = "0.10.1"
rand_distr = "0.6.0"
