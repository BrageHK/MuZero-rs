# Network

network_type: ResNet # Linear, ResNet
environment: Othello # CartPole, TicTacToe, Othello, Atari

atari_game: Breakout

# Only for MLP
linear:
    representation:
        latent_space_dims: 32
        fc_hidden_size: 32
        n_layers: 3
    dynamic:
        latent_space_dims: 32
        fc_hidden_size: 32
        n_layers: 3
    prediction:
        latent_space_dims: 32
        fc_hidden_size: 64
        n_layers: 3

resnet:
    channels: 256
    n_blocks: 10
    fc_hidden_size: 128

# SimSiam projector (P1) / predictor (P2) for the EfficientZero consistency loss.
# For ResNet the projector reduces channels and pools to 6x6 before these sizes apply.
projection:
    proj_hidden: 256
    proj_out: 64
    pred_hidden: 128

# Compute backends. Must be compiled in via cargo features (see crates/mz-train/Cargo.toml).
# Options: auto, cuda, rocm, metal, vulkan, wgpu, flex, ndarray, libtorch, libtorch-gpu
# auto = best compiled-in backend (cuda > metal > rocm > vulkan > wgpu > libtorch > flex > ndarray)
# Use cargo .... --features <YOUR-BACKEND>
training_backend: vulkan # wgpu
inference_backend: vulkan # ndarray

# Training + algorithm
n_steps: 5
unroll_steps: 5
train_ratio: 2

# Batch sizes
training_batch_size: 1024
game_batch_size: 2048

# Optimizer
optimizer: Sgd # AdamW, Adam, Sgd
learning_rate: 0.1
lr_decay_rate: 0.1
lr_decay_steps: 350000
lr_warmup_steps: 100    # Number of training steps to warmup
grad_clip: 1.0
weight_decay: 1e-4
momentum: 0.9

# Loss weights
value_coef: 0.25
policy_coef: 1.0
reward_coef: 1.0                    # Omitted in board games
consistency_coef: 2.0               # 2.0 on board, 5.0 on atari


augmentation: false                 # Only useful for atari


# Search
search_algorithm: Gumbel # Puct, Gumbel
num_simulations: 32
discount: 1.0 # 0.997

puct:
    dirichlet_alpha: 0.25
    root_exploration_fraction: 0.25
    temperature_schedule:
        - step: 500000
          tau: 1.0
        - step: 750000
          tau: 0.5
        - step: null # remaining steps
          tau: 0.25

gumbel:
    max_num_considered_actions: 8 # top-m root actions entering Sequential Halving
    c_visit: 50.0
    c_scale: 0.1

# Elo rating for board games
eval:
    interval: 1000                  # training steps between evals. 0 disables
    games: 2048
    num_simulations: null           # null = same as training
    random_opening_plies: 4         # random plies before the agents take over
    promote_score: 0.80             # score at which the agent moves up one opponent
    demote_score: 0.20              # score at which it drops back down
    seed: 1592426000
    ladder: null

support_size: 35                    # Not used in board games

inference_update_interval: 100      # update inference network every N training steps
checkpoint_interval: 10000          # save network checkpoint to model/env_name every N training steps

# Plotting
avg_window: 100                     # avg-reward plot averages over the last N finished games
rate_window_secs: 10                # env-steps/sec plot averages over the last N seconds

buffer_size: 1000000
training_steps: 10000000

# Reanalyze
reanalyze_fraction: 0.05            # chance per iteration of refreshing the stalest samples; 0.0 disables
reanalyze_batch_size: 2048          # candidate entries sampled per training step

# Parallel settings
rayon_min_chunk_len: 512

# Optional: checkpoint under model/ to init agent from (path w/o .mpk ext, e.g. "model/latest" or "model/best").
# null/omitted = fresh random init.
init_checkpoint: null #model/Othello/latest.mpk
