[package]
name = "mz-web"
version.workspace = true
edition.workspace = true

# cdylib for the .wasm artifact, rlib so native tests can link it.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mz-core = { path = "../mz-core" }
chess = "3.2.0"
burn = { workspace = true, features = ["std"] }
# Runtime dependency of the code build.rs generates from onnx/chess_mamba.onnx
# (see model/chess_mamba.rs) -- burn-onnx's generated `Model` loads its
# embedded weights through `burn_store::BurnpackStore`.
burn-store = "~0.21"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
# examples/bench_mcts.rs only, to pin libtorch's own intra-op thread pool to
# 1 when it's being called from many outer (tree-parallel) threads at once --
# see that example for why. Optional + gated by the `tch` feature (not a
# plain dev-dependency: Cargo doesn't allow optional dev-dependencies, and an
# unconditional one would force every example/test build, even ndarray-only
# ones, to resolve a libtorch install).
tch = { version = "0.22", optional = true }

# burn pulls `rand`, whose entropy source has no default backend on
# wasm32-unknown-unknown; the browser one is behind this feature.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[build-dependencies]
# Converts onnx/chess_mamba.onnx (ChessMamba, exported from the separate
# bee-chess repo's training/src/bee_training/chess_mamba/export_onnx.py)
# into a Burn module at build time -- see build.rs.
burn-onnx = { workspace = true }

[dev-dependencies]
mz-train = { path = "../mz-train", default-features = false, features = ["ndarray"] }
fastrand = "2.4.1"
# examples/uci_chess_mamba_mcts.rs only: create_chess_mamba() is async only
# for wasm-bindgen's calling convention (init_backend is a no-op on every
# native backend), so a single manual poll -- no real runtime -- is enough.
pollster = "0.4"

[features]
default = ["flex"]
flex = ["burn/flex", "mz-core/flex"]
# Native tests/benchmarks only -- none of these build for wasm32.
ndarray = ["burn/ndarray", "mz-core/ndarray"]
tch = ["burn/tch", "mz-core/tch", "dep:tch"]
metal = ["burn/metal", "burn/fusion", "mz-core/metal"]
vulkan = ["burn/vulkan", "burn/fusion", "mz-core/vulkan"]
