[package]
name = "mz-web"
version.workspace = true
edition.workspace = true

# cdylib for the .wasm artifact, rlib so native tests can link it.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mz-core = { path = "../mz-core" }
burn = { workspace = true, features = ["std"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# burn pulls `rand`, whose entropy source has no default backend on
# wasm32-unknown-unknown; the browser one is behind this feature.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
mz-train = { path = "../mz-train", default-features = false, features = ["ndarray"] }
fastrand = "2.4.1"

[features]
# WebGPU in the browser. `burn/wgpu` alone would leave burn-wgpu without a
# shader compiler, since burn's default features are off here; `webgpu` pulls in
# the wgsl one. Fusion stays off: burn recommends against it on wasm.
default = ["webgpu"]
webgpu = ["burn/webgpu", "mz-core/webgpu"]
# Pure-Rust SIMD128 CPU backend. Works on any browser and is the faster choice
# for a batch-of-1 MLP.
flex = ["burn/flex", "mz-core/flex"]
# Native tests only.
ndarray = ["burn/ndarray", "mz-core/ndarray"]
