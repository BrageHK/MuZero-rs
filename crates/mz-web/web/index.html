<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MuZero Games</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="landing">
      <header>
        <h1>MuZero Games</h1>
        <p class="sub">Small from-scratch game-playing agents, running entirely in your browser.</p>
      </header>

      <div class="game-grid">
        <a class="game-card" href="./othello/index.html">
          <span class="game-icon">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
              <rect width="32" height="32" rx="6" fill="#1b6b3a" />
              <rect x="3" y="3" width="26" height="26" rx="3" fill="#22803f" stroke="#0f4023" stroke-width="1" />
              <circle cx="12" cy="12" r="6" fill="#111111" />
              <circle cx="21" cy="21" r="6" fill="#f5f5f0" />
            </svg>
          </span>
          <span class="game-label">Othello</span>
        </a>

        <a class="game-card" href="./chess/index.html">
          <span class="game-icon">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
              <rect width="32" height="32" rx="6" fill="var(--line)" />
              <rect x="3" y="3" width="26" height="26" rx="3" fill="var(--panel)" stroke="var(--line)" stroke-width="1" />
              <rect x="15" y="4.5" width="2" height="4" fill="var(--accent)" />
              <rect x="13" y="6.5" width="6" height="2" fill="var(--accent)" />
              <circle cx="16" cy="12.5" r="2.4" fill="var(--accent)" />
              <path d="M11 16.5 L21 16.5 L19.5 23.5 L12.5 23.5 Z" fill="var(--accent)" />
              <rect x="9.5" y="23.5" width="13" height="2.6" rx="1" fill="var(--accent)" />
              <rect x="7.5" y="26.5" width="17" height="2.6" rx="1" fill="var(--accent)" />
            </svg>
          </span>
          <span class="game-label">Chess</span>
        </a>
      </div>
    </main>
  </body>
</html>
